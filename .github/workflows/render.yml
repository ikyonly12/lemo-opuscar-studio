name: Lemo-Opuscar Cloud Render Farm

on:
  workflow_dispatch:
    inputs:
      style:
        description: 'Visual Style Slug (e.g. paper-popup, brick-toy, exploded-teardown, watercolor)'
        required: true
        default: 'paper-popup'
      aspect_ratio:
        description: 'Aspect Ratio (16:9 Landscape or 9:16 Portrait)'
        required: true
        default: '16:9'
      language:
        description: 'Production Language (id = Bahasa Indonesia, en = English)'
        required: true
        default: 'id'
      topic:
        description: 'Story Topic & Brief'
        required: true
        default: 'Inovasi Sejarah Tersembunyi'
      treatment_b64:
        description: 'Base64-encoded AI Treatment JSON payload'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  render_film:
    name: Cloud Render & Direct Download Assembly
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Studio Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Codecs & Headless Display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb libgl1 mesa-utils

      - name: Install Python Audio & Voice Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Lemo-Opuscar Core Library
        run: |
          git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git "$HOME/lemo-opuscar"
          cd "$HOME/lemo-opuscar"
          npm install --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
          node node_modules/playwright-core/cli.js install chromium-headless-shell

      - name: Inject Dynamic Story Treatment (Zero Dummy Data)
        env:
          TREATMENT_B64: ${{ github.event.inputs.treatment_b64 }}
          TOPIC: ${{ github.event.inputs.topic }}
          STYLE: ${{ github.event.inputs.style }}
          LANGUAGE: ${{ github.event.inputs.language }}
          ASPECT_RATIO: ${{ github.event.inputs.aspect_ratio }}
        run: |
          python templates/engine/inject_story.py
          head -n 25 templates/engine/story.json

      - name: Execute Cloud Render Pipeline
        run: |
          LIB="$HOME/lemo-opuscar"
          AR="${{ github.event.inputs.aspect_ratio }}"
          STYLE="${{ github.event.inputs.style }}"

          if [ "$AR" = "9:16" ]; then
            SIZE="1080x1920"
          else
            SIZE="1920x1080"
          fi

          echo "================================================="
          echo "STARTING CLOUD RENDER ON GITHUB ACTIONS WORKER"
          echo "Style: $STYLE | Aspect Ratio: $AR ($SIZE)"
          echo "================================================="

          OUT_DIR="$GITHUB_WORKSPACE/export"
          mkdir -p "$OUT_DIR"
          TARGET_DIR="$GITHUB_WORKSPACE/templates/engine"

          # 1. Frame-Zero Keyframe Validation
          echo "[1/4] Running Frame-Zero keyframe validation..."
          xvfb-run -a node "$LIB/core/render/still.mjs" "$TARGET_DIR" 1.5 12 --size "$SIZE"

          # 2. Parallel Frame-by-Frame Video Capture
          echo "[2/4] Capturing deterministic frames across 3 parallel Playwright workers..."
          xvfb-run -a node "$LIB/core/render/video.mjs" "$TARGET_DIR" --fps 24 --workers 3 --size "$SIZE" --out "$OUT_DIR/video.mp4"

          # 3. Audio Synthesis (Neural Voiceover + 4-Layer BGM Mix)
          echo "[3/4] Synthesizing neural voiceover & mixing 4-layer BGM..."
          cd "$GITHUB_WORKSPACE/templates/engine"
          python mix.py
          cp out/mix.wav "$OUT_DIR/mix.wav"
          cd "$GITHUB_WORKSPACE"

          # 4. Final Mux with ITU-R BS.1770 Two-Pass Loudnorm (-14 LUFS)
          echo "[4/4] Muxing final broadcast MP4 with two-pass loudnorm..."
          sh "$LIB/core/render/mux.sh" "$OUT_DIR/video.mp4" "$OUT_DIR/mix.wav" "$OUT_DIR/final_film.mp4" 24 2

          echo "================================================="
          echo "CLOUD RENDER COMPLETED SUCCESSFULLY!"
          ls -lh "$OUT_DIR/final_film.mp4"
          echo "================================================="

      - name: Create Direct Public Download Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="render-${{ github.run_id }}"
          echo "Publishing direct download MP4 asset to GitHub Release tag: $TAG"
          gh release create "$TAG" \
            export/final_film.mp4 \
            --title "Render: ${{ github.event.inputs.style }} (#${{ github.run_id }})" \
            --notes "Direct MP4 Download for Lemo-Opuscar Studio. Topic: ${{ github.event.inputs.topic }}"
